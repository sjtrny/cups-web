name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publications so an older run cannot overwrite a newer latest tag.
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    name: Publish ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cups
            package: label-printer-cups
            context: .
            visibility: private
            description: CUPS print server with the Brother QL-1110NWB driver
          - image: web
            package: cups-web
            context: ./minimal-web
            visibility: public
            description: Minimal web print interface for CUPS
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.package }}
        run: |
          echo "package=${PACKAGE,,}" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${OWNER,,}/${PACKAGE,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Verify package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.image.outputs.package }}
          VISIBILITY: ${{ matrix.visibility }}
        run: |
          gh api "users/$GITHUB_REPOSITORY_OWNER/packages/container/$PACKAGE" > "$RUNNER_TEMP/package.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          package = json.loads((Path(os.environ["RUNNER_TEMP"]) / "package.json").read_text())
          expected = os.environ["VISIBILITY"]
          assert package["visibility"] == expected, f'The image package must be {expected}'
          print(f'{package["name"]}: {expected}')
          PY
      - name: Check anonymous image access
        if: matrix.visibility == 'public'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '{}' > "$DOCKER_CONFIG/config.json"
          docker manifest inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null
      - name: Pull published image and check source metadata
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          docker pull "$IMAGE@$DIGEST"
          docker image inspect "$IMAGE@$DIGEST" > "$RUNNER_TEMP/image.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          image = json.loads((Path(os.environ["RUNNER_TEMP"]) / "image.json").read_text())[0]
          labels = image["Config"]["Labels"]
          source = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}'
          assert labels["org.opencontainers.image.source"] == source, "Image source must identify this repository"
          assert labels["org.opencontainers.image.revision"] == os.environ["GITHUB_SHA"], "Image revision must match the published commit"
          assert (image["Os"], image["Architecture"]) == ("linux", "amd64"), "The stack requires linux/amd64"
          print(f'Published linux/amd64 image matches {source} at {os.environ["GITHUB_SHA"]}')
          PY
          printf 'Published image: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
